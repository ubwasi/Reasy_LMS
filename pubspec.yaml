name: ready_lms
description: A new Flutter project
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  firebase_core: ^4.6.0
  google_sign_in: ^6.2.1
  firebase_auth: ^6.3.0
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/font/

  fonts:
    - family: inter
      fonts:
        - asset: assets/font/Inter_18pt-Regular.ttf